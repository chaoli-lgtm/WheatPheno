[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wheatpheno"
version = "0.4.0"
description = "UAV wheat phenotyping, model deployment and DSM/DTM height mapping"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "WheatPheno contributors"}]
dependencies = [
  "numpy==2.3.5", "pandas==3.0.1", "scikit-learn==1.9.1",
  "scipy==1.18.1", "joblib==1.6.0", "matplotlib>=3.10,<4",
  "rasterio==1.4.4", "pyshp>=2.3,<4", "pyproj>=3.7,<4", "pillow>=11,<13"
]

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
wheatpheno = "wheatpheno.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/wheatpheno/models" = ["models/manifest.json", "models/schema.json", "models/AGB_ExtraTrees_full_refit.joblib", "models/Yield_ExtraTrees_full_refit.joblib"]
"share/wheatpheno/examples" = ["examples/manifest.json"]
"share/wheatpheno/examples/tables" = ["examples/tables/agb_demo.csv", "examples/tables/agb_expected.csv", "examples/tables/yield_demo.csv", "examples/tables/yield_expected.csv"]
"share/wheatpheno/examples/synthetic" = ["examples/synthetic/training_demo.csv", "examples/synthetic/feature_input.npz", "examples/synthetic/README.md"]
"share/wheatpheno" = ["app.py", "LICENSE", "DATA_LICENSE.md", "RELEASE_MANIFEST.json"]

"share/wheatpheno/benchmarks" = ["benchmarks/README.md", "benchmarks/model_comparison.csv", "benchmarks/repetition_metrics.csv", "benchmarks/subgroup_metrics.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
